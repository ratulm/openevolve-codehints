# Hints pilot (circle packing, n=26). Identical for both arms; only the
# initial program differs. The system message is deliberately generic so it
# carries no task-specific hints.
max_iterations: 20
checkpoint_interval: 5
log_level: "INFO"
random_seed: 1

llm:
  provider: "claude_code"
  models:
    - name: "us.anthropic.claude-fable-5-2"
      weight: 0.8
      max_tokens: 16000
      timeout: 300
      max_budget_usd: 1.0
    - name: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      weight: 0.2
      max_tokens: 8000
      timeout: 120
      max_budget_usd: 0.5
  retries: 3
  retry_delay: 5

prompt:
  system_message: >
    You are an expert programmer. Improve the given program so that it
    scores higher on the evaluation metrics.
  num_top_programs: 3

database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: false

diff_based_evolution: true
max_code_length: 20000
